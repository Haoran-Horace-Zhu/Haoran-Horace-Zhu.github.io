        snapshot:
          title: Cutoff for random Cayley graphs of finite groups
          authors:
            - Haoran Zhu
          year: "2026"
          journal: Preprint
          abstract: >-
            We show that the continuous-time random walk on a Cayley graph generated by independent uniform elements exhibits cutoff with high probability whenever the number of generators grows faster than the logarithm of the group order and is subpolynomial in that order. We give a deterministic cutoff time in terms of the expected entropy of the walk; this time may depend on the group structure.
          bibtex: |
            @article{Zhu2026RandomCayleyCutoff,
              author={Zhu, Haoran},
              title={Cutoff for random Cayley graphs of finite groups},
              journal={Preprint},
              year={2026},
