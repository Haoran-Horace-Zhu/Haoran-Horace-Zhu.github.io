        snapshot:
          title: Symmetric exclusion versus independent random walks via the Octopus inequality
          authors:
            - Haoran Zhu
          year: "2026"
          journal: Preprint
          abstract: >-
            We prove that the total-variation mixing time of the symmetric exclusion process is at most a universal constant times that of the same number of independent random walks, resolving a longstanding conjecture of Oliveira. The comparison holds on every finite connected weighted graph, uniformly in the number of particles, and extends to $L^2$ mixing times. We also compare the Dirichlet forms of exclusion on the given graph and on the complete graph, with a coefficient that is optimal up to a universal constant.
          bibtex: |
            @article{Zhu2026SymmetricExclusion,
              author={Zhu, Haoran},
